# Refresh the public AI-in-trading digest on nova.altaystudio.com.
#
# Static site: no API, no secrets. This job pre-renders the homepage teaser
# and the /news feed, then commits straight to main. Vercel redeploys from
# git. Vercel is often rate-limited; git history can move while the CDN lags.
#
# In the Nova repo this job had to open a pull request, because required
# status checks there rejected a direct digest commit (GH006). This repo has
# no such protection, so the PR dance is gone -- that churn is exactly why the
# site was split out.
#
# GitHub cron is best-effort (often delayed under load). 10 minutes is the
# target, not a hard SLA.
#
# Sources are public RSS/Atom and the generator is stdlib-only. A thin fetch
# exits without overwriting a good /news page.

name: AI news digest

on:
  schedule:
    # Every 10 minutes, offset from :00 so we are not in the hourly stampede.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

# Serialize: two overlapping runs would race on the same branch.
concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests (ranking must hold before it can publish)
        run: python -m pytest tools/test_ai_news*.py -q

      - name: Rebuild the digest
        run: python tools/ai_news_digest.py --limit 6 --feed-limit 60

      - name: Commit when the pages changed
        run: |
          if git diff --quiet -- site/; then
            echo "digest unchanged; nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git commit -m "chore(site): refresh AI-in-trading news feed"
          git push
